# Keybinds

bind-key -n M-t new-window # Open new window
bind-key -n M-r command-prompt -I "" "rename-window '%%'" # Rename current window
bind-key -n M-w kill-pane\; select-layout even-horizontal
bind-key -n M-1 select-pane -t 0 -Z # Go to window 1
bind-key -n M-2 select-pane -t 1 -Z # Go to window 2
bind-key -n M-3 select-pane -t 2 -Z # Go to window 3
bind-key -n M-4 select-pane -t 3 -Z # Go to window 4
bind-key -n M-5 select-pane -t 4 -Z # Go to window 5
bind-key -n M-6 select-pane -t 5 -Z # Go to window 6
bind-key -n M-7 select-pane -t 6 -Z # Go to window 7
bind-key -n M-8 select-pane -t 7 -Z # Go to window 8
bind-key -n M-9 select-pane -t 8 -Z # Go to window 9
bind-key -n M-0 select-pane -t 9 -Z # Go to window 10
bind-key -n C-PageUp previous-window # Go to previous window
bind-key -n C-M-h previous-window # Go to previous window
bind-key -n C-PageDown next-window # Go to next window
bind-key -n C-M-l next-window # Go to next window
bind-key -n C-S-PageUp swap-window -t -1\; select-window -t -1 # Move window to lef
bind-key -n C-S-PageDown swap-window -t +1\; select-window -t +1 # Move window to right
bind-key -n M-d split-window -h -c '#{pane_current_path}' \; select-layout even-horizontal # Split window in the current path and spread them evenly
bind-key -n M-z resize-pane -Z # Zoom pane

# Go to previous pane, preventing loop
# If is zoomed, unzoom+zoom
# because a zoomed pane is considered the leftmost pane
bind-key -n M-h if -F '#{window_zoomed_flag}' {
  resize-pane -Z
  if -F '#{pane_at_left}' '' 'select-pane -L'
  resize-pane -Z
} {
  if -F '#{pane_at_left}' '' 'select-pane -L'
}

# Go to next pane, preventing loop
# If is zoomed, unzoom+zoom,
# because a zoomed pane is considered the rightmost pane
bind-key -n M-l if -F '#{window_zoomed_flag}' {
  resize-pane -Z
  if -F '#{pane_at_right}' '' 'select-pane -R'
  resize-pane -Z
} {
  if -F '#{pane_at_right}' '' 'select-pane -R'
}


# Design tweaks

### Status bar
set -g status-position top
set -g status-style 'bg=black'
set -g status-left ' #{e|+:#{pane_index},1}/#{window_panes} '
set -g status-right ''

### Active window
setw -g window-style 'bg=#13141c fg=default'
setw -g window-active-style 'bg=#1a1b26 fg=default'
setw -g window-status-current-style 'bg=white fg=black'
setw -g window-status-current-format ' #W '

### Other windows
setw -g window-status-style 'bg=black fg=white dim'
setw -g window-status-format ' #W '


# Tweaks

### Prevent slow Esc inside Neovim
set -sg escape-time 0

### Enable mouse
set -g mouse on

### Focus events for Neovim
set-option -g focus-events on

### Fix colors for Neovim inside tmux
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Tc"

### Fix Enter modifier keys
set -g extended-keys on
set -g extended-keys-format csi-u
